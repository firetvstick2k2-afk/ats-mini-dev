name: Build Firmware

on:
  workflow_dispatch:
    inputs:
      revision:
        description: "Optional release tag, e.g. v1.00"
        type: string
        required: false

jobs:
  build:
    name: build ospi-de
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      slug: ${{ steps.slug.outputs.slug }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: "${{ github.ref }}"

      - name: Prepare German menu
        run: cp ats-mini/Menu_german.cpp.src ats-mini/Menu.cpp

      - name: Get version slug
        id: slug
        run: |
          SLUG="${{ github.event.inputs.revision }}"
          if [ -z "$SLUG" ]; then
            SLUG=$(git describe --tags --match 'v*' --always --dirty || echo v0.00)
          fi
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"

      - name: Free disk space for ESP32 toolchain
        run: |
          echo "Disk space before cleanup:"
          df -h /
          sudo du -xhd1 /usr/local /opt /usr/share 2>/dev/null | sort -h | tail -n 25 || true
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /usr/local/share/powershell /usr/local/.ghcup /usr/share/swift
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          echo "Disk space after cleanup:"
          df -h /

      - name: Compile OSPI-DE firmware
        uses: arduino/compile-sketches@v1
        with:
          cli-version: 1.4.1
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sketch-paths: |
            - ats-mini
          fqbn: esp32:esp32:esp32s3:CDCOnBoot=cdc,FlashSize=8M,PSRAM=opi,CPUFreq=80,USBMode=hwcdc,FlashMode=qio,PartitionScheme=custom,DebugLevel=none
          cli-compile-flags: |
            - --profile
            - esp32s3-ospi
            - --export-binaries
          enable-deltas-report: false
          enable-warnings-report: true

      - name: Prepare single firmware binary
        run: |
          mkdir -p artifact
          test -s ats-mini/build/esp32.esp32.esp32s3/ats-mini.ino.bin
          cp ats-mini/build/esp32.esp32.esp32s3/ats-mini.ino.bin "artifact/Mini_OS_#${{ github.run_number }}.bin"
          ls -lh artifact

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: Mini_OS-build-${{ github.run_number }}-ospi-de
          path: artifact/Mini_OS_#${{ github.run_number }}.bin
          archive: false
          if-no-files-found: error
          retention-days: 14

  release:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.revision != '') || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) }}
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: "${{ github.ref }}"

      - name: Download firmware binary
        uses: actions/download-artifact@v8
        with:
          name: Mini_OS-build-${{ github.run_number }}-ospi-de
          path: artifact

      - name: Prepare release notes
        env:
          SLUG: ${{ needs.build.outputs.slug }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          slug = os.environ["SLUG"]
          changelog = Path("CHANGELOG.md").read_text()
          version = re.escape(slug.removeprefix("v"))
          match = re.search(rf"(^## {version} .*?)(?=^## \d|\Z)", changelog, re.MULTILINE | re.DOTALL)
          Path("release-notes.md").write_text(match.group(0) if match else f"OSPI-DE test firmware {slug}")
          PY

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SLUG: ${{ needs.build.outputs.slug }}
        run: gh release create "$SLUG" --repo "${{ github.repository }}" --target "${{ github.sha }}" --notes-file release-notes.md

      - name: Upload raw firmware binary
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SLUG: ${{ needs.build.outputs.slug }}
        run: gh release upload "$SLUG" artifact/*.bin --repo "${{ github.repository }}" --clobber
