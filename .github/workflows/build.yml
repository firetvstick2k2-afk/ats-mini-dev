name: Build Firmware

on:
  # Builds are started manually by the repository owner during FM-DX development.
  workflow_dispatch:
    inputs:
      revision:
        description: "Optional release tag, e.g. v1.00"
        type: string
        required: false

jobs:
  build:
    name: build ospi-de
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      slug: ${{ steps.slug.outputs.slug }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          fetch-tags: false
          ref: "${{ github.ref }}"

      - name: Prepare German menu
        run: cp ats-mini/Menu_german.cpp.src ats-mini/Menu.cpp

      - name: Get version slug
        id: slug
        run: |
          SLUG="${{ github.event.inputs.revision }}"
          if [ -z "$SLUG" ]; then
            SLUG=$(git rev-parse --short=7 HEAD)
          fi
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"

      - name: Cache Arduino packages and libraries
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: ~/.arduino15
          key: arduino-${{ runner.os }}-cli-1.4.1-esp32-3.3.12-${{ hashFiles('ats-mini/sketch.yaml') }}
          restore-keys: |
            arduino-${{ runner.os }}-cli-1.4.1-esp32-3.3.12-

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.4.1

      - name: Compile OSPI-DE firmware
        working-directory: ats-mini
        env:
          ARDUINO_LIBRARY_ENABLE_UNSAFE_INSTALL: "true"
        run: |
          arduino-cli core update-index --config-file arduino-cli.yaml
          arduino-cli core install esp32:esp32@3.3.12 --config-file arduino-cli.yaml
          arduino-cli lib install "PU2CLR SI4735@2.1.8" "LovyanGFX@1.2.32" "Async TCP@3.5.0" "ESP Async WebServer@3.12.1" "NTPClient@3.2.1" "ArduinoJson@7.4.2" --config-file arduino-cli.yaml
          arduino-cli compile --verbose --export-binaries --config-file arduino-cli.yaml --profile esp32s3-ospi --fqbn esp32:esp32:esp32s3:CDCOnBoot=cdc,FlashSize=8M,PSRAM=opi,CPUFreq=80,USBMode=hwcdc,FlashMode=qio,PartitionScheme=custom,DebugLevel=verbose --build-path build/esp32.esp32.esp32s3 --build-property "compiler.cpp.extra_flags=-DCONFIG_ASYNC_TCP_STACK_SIZE=32768 -DUSE_ESP_IDF_LOG" --build-property "compiler.c.extra_flags=-DUSE_ESP_IDF_LOG" .

      - name: Prepare firmware and debug artifacts
        run: |
          mkdir -p artifact
          BUILD_DIR="ats-mini/build/esp32.esp32.esp32s3"
          test -s "$BUILD_DIR/ats-mini.ino.bin"
          test -s "$BUILD_DIR/ats-mini.ino.elf"
          test -s "$BUILD_DIR/ats-mini.ino.map"
          cp "$BUILD_DIR/ats-mini.ino.bin" "artifact/Mini_OS_#${{ github.run_number }}.bin"
          cp "$BUILD_DIR/ats-mini.ino.elf" "artifact/Mini_OS_#${{ github.run_number }}.elf"
          cp "$BUILD_DIR/ats-mini.ino.map" "artifact/Mini_OS_#${{ github.run_number }}.map"
          ls -lh artifact

      - name: Upload firmware and debug artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Mini_OS-build-${{ github.run_number }}-ospi-de
          path: artifact/*
          archive: false
          if-no-files-found: error
          retention-days: 14

  release:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.revision != '' }}
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: "${{ github.ref }}"

      - name: Download firmware binary
        uses: actions/download-artifact@v8
        with:
          name: Mini_OS-build-${{ github.run_number }}-ospi-de
          path: artifact

      - name: Prepare release notes
        env:
          SLUG: ${{ needs.build.outputs.slug }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path
          slug = os.environ["SLUG"]
          changelog = Path("CHANGELOG.md").read_text()
          version = re.escape(slug.removeprefix("v"))
          match = re.search(rf"(^## {version} .*?)(?=^## \\d|\\Z)", changelog, re.MULTILINE | re.DOTALL)
          Path("release-notes.md").write_text(match.group(0) if match else f"OSPI-DE test firmware {slug}")
          PY

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SLUG: ${{ needs.build.outputs.slug }}
        run: gh release create "$SLUG" --repo "${{ github.repository }}" --target "${{ github.sha }}" --notes-file release-notes.md

      - name: Upload firmware and debug symbols
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SLUG: ${{ needs.build.outputs.slug }}
        run: gh release upload "$SLUG" artifact/* --repo "${{ github.repository }}" --clobber
